version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: krbl_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krbl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-krbl_agro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krbl_user} -d ${POSTGRES_DB:-krbl_agro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - krbl_network

  redis:
    image: redis:7-alpine
    container_name: krbl_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - krbl_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krbl_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-krbl_user}:${POSTGRES_PASSWORD:-secure_db_password_123}@postgres:5432/${POSTGRES_DB:-krbl_agro}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:-krbl_enterprise_secret_key_change_in_production_99887766}
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - krbl_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: krbl_frontend
    restart: always
    networks:
      - krbl_network

  gateway:
    image: nginx:alpine
    container_name: krbl_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - krbl_network

volumes:
  postgres_data:
  redis_data:

networks:
  krbl_network:
    driver: bridge
